<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cardápio</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <header>
       <p>Cardápio Digital</p>
       <nav>
        <ul>
            <a href="index.html"><li>Cardápio</li></a>
            <a href="cadastrar.html"><li>Cadastrar</li></a>
            <a href="relatorio.php"><li>Relatório</li></a>
            <a href="sair.php"><li>Sair</li></a>

        </ul>
       </nav>
    </header>
    <main>
        <h1>
            Cadastro - Cardápio
        </h1>
        <form action="" method="post">
            <div id="grid">
                <div>
                    <label for="produto">Produto</label>
                    <input type="text" name="produto" id="produto" placeholder="Ex: X-Salada" required>
                </div>
                <div>
                    <label for="ingredientes">Ingredientes</label>
                    <input type="text" name="ingredientes" id="ingredientes" required>
                </div>
                <div>
                    <label for="valor">Valor</label>
                    <input type="number" step="0.00" name="valor" id="valor" required>
                </div>
                <div>
                    <label for="categoria">Categoria</label>
                    <select name="categoria" id="categoria" required>
                        <option value="" disabled selected>Selecione uma categoria</option>
                        <option value="Artesanal">Artesanais</option>
                        <option value="Tradicional">Tradicionais</option>
                        <option value="Bebidas">Bebidas</option>
                        <option value="Sobremesas">Sobremesas</option>
                        <option value="Porções">Porções</option>
                        <option value="Combos">Combos</option>
                    </select>
                  </div>
                    <div>
                        <label for="imagem">Imagem</label>
                        <input type="file" name="imagem" id="imagem" required>
                    </div>
                    <div>
                        <label for="descricao">Descrição</label>
                        <textarea name="descricao"
                            id="descricao"></textarea>
                    </div>
                </div>
                <input type="submit" value="Cadastar">
            </form>
    </main>
    <footer>
        &copy; 2026 - Todos os direitos reservados
    </footer>
</body>

</html>
